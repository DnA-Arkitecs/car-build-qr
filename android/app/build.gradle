// The Android app is a thin shell: one WebView that runs the same page as the
// website from files packed inside the app (tools/android.py copies them into
// src/main/assets/web before each build). No libraries beyond Android itself.
plugins { id 'com.android.application' }

android {
    namespace 'io.github.dnaarkitecs.buildtag'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.dnaarkitecs.buildtag'
        minSdk 29          // Android 10: saving to Downloads needs no storage permission
        targetSdk 34
        versionCode 2
        versionName '0.2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
